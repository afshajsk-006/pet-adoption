<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PawsHome Adoption Center</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="login-page">

<div class="login-card">
  <!-- Icon -->
  <div class="login-icon">🐾</div>
  <div class="login-title">PawsHome</div>
  <div class="login-subtitle">Adoption Center Admin Portal</div>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show py-2 mb-3" role="alert" style="border-radius:10px;font-size:0.88rem;">
      <i class="bi bi-exclamation-circle-fill me-1"></i>{{ message }}
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}" data-loading>
    <!-- Email -->
    <div class="mb-3">
      <label class="form-label" for="email">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="admin@petadopt.com" required autocomplete="email" />
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Enter your password" required autocomplete="current-password" />
        <button class="btn btn-outline-secondary" type="button" id="togglePw" tabindex="-1"
                style="border-radius:0 10px 10px 0;border-left:none;">
          <i class="bi bi-eye" id="togglePwIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>

  <p class="text-center mt-3 mb-0" style="font-size:0.78rem;color:#bbb;">
    Default: admin@petadopt.com / admin123
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  // Toggle password visibility
  const togglePw = document.getElementById('togglePw');
  const pwInput = document.getElementById('password');
  const pwIcon = document.getElementById('togglePwIcon');
  if (togglePw) {
    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      pwIcon.className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
    });
  }
</script>
</body>
</html>
